###############################################################################
# NAGIOS CORE SERVICE MONITORING CONFIGURATION
# Application: Hostel Management System (CampusStay)
# Target Host: Production Docker Host (127.0.0.1)
###############################################################################

# ==========================================
# 1. Host Definition
# ==========================================
define host {
    use                     linux-server
    host_name               hostel-production-host
    alias                   CampusStay Hostel Production Host
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
}

# ==========================================
# 2. Service Group Definition
# ==========================================
define servicegroup {
    servicegroup_name       hostel-management-stack
    alias                   CampusStay Hostel Management Services
}

# ==========================================
# 3. Service: Host Disk Space Utilization
# Thresholds: Warning at 20% free, Critical at 10% free
# ==========================================
define service {
    use                     generic-service
    host_name               hostel-production-host
    service_description     Host Disk Space Utilization
    servicegroups           hostel-management-stack
    check_command           check_local_disk!20%!10%!/
    max_check_attempts      3
    check_interval          5
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    w,c,r
    contact_groups          admins
}

# ==========================================
# 4. Service: Frontend Web Portal Availability
# Target: Nginx Web Server on Port 80 (HTTP 200 OK)
# Warning: > 2s latency, Critical: > 5s latency
# ==========================================
define service {
    use                     generic-service
    host_name               hostel-production-host
    service_description     Frontend Web Portal (Port 80)
    servicegroups           hostel-management-stack
    check_command           check_http!-p 80 -u / -w 2.0 -c 5.0
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# ==========================================
# 5. Service: Backend API & Supabase Healthcheck Probe
# Target: FastAPI backend on Port 8000 at /health
# Verifies: HTTP 200 and presence of expected status string "UP"
# ==========================================
define service {
    use                     generic-service
    host_name               hostel-production-host
    service_description     Backend API & Supabase Health (Port 8000)
    servicegroups           hostel-management-stack
    check_command           check_http!-p 8000 -u /health -s "UP" -w 2.0 -c 5.0
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}

# ==========================================
# 6. Service: Reverse Proxy API Ingress Verification
# Target: Nginx ingress proxying /api/rooms on Port 80
# Ensures reverse proxy mapping between Nginx and FastAPI works
# ==========================================
define service {
    use                     generic-service
    host_name               hostel-production-host
    service_description     Nginx Reverse Proxy Ingress (Port 80 /api/rooms)
    servicegroups           hostel-management-stack
    check_command           check_http!-p 80 -u /api/rooms -w 2.0 -c 5.0
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
}
